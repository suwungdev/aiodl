<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AIODL Admin</title><link rel="icon" href="/favicon.png"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>:root{--bg:#08090f;--panel:#10131d;--line:#252a37;--text:#f5f6fa;--muted:#8f96a8;--accent:#9b8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#19152e,#08090f 48%);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}.top{min-height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:#fff}.brand img{width:38px;height:38px;border-radius:12px}.brand small{display:block;color:var(--muted);font-size:10px}.logout{border:1px solid var(--line);background:#fff0;color:#c5cad5;padding:9px 12px;border-radius:10px}.main{padding:42px 0 80px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.title{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em;margin:7px 0}.sub{color:var(--muted);margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#10131d;border:1px solid var(--line);border-radius:18px;padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.name{font-weight:800}.id{font-size:11px;color:#687082;margin-top:3px}.status{font-size:11px;font-weight:800;margin-top:7px}.online{color:#6ed6a0}.maint{color:#ffbd70}.off{color:#ff7f91}.controls{margin-top:14px;display:grid;gap:9px}.switchrow{display:flex;align-items:center;justify-content:space-between;color:#aeb4c1}.switch{appearance:none;width:44px;height:24px;border-radius:99px;background:#282e3c;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s}.switch:checked{background:#8d7cff}.switch:checked:after{transform:translateX(20px)}textarea{width:100%;min-height:66px;resize:vertical;background:#0a0c12;color:#e8eaf0;border:1px solid var(--line);border-radius:11px;padding:10px;font:13px inherit}button.save{border:0;background:#8d7cff;color:#08090f;font-weight:800;border-radius:10px;padding:10px 13px;cursor:pointer}.hint{color:#626a7a;font-size:11px;margin-top:22px}@media(max-width:700px){.grid{grid-template-columns:1fr}.main{padding-top:30px}.top{min-height:64px}}</style></head><body><header class="wrap top"><a class="brand" href="/"><img src="/suwung-logo.png" alt="suwung.id"><span><strong>AIODL Admin</strong><small>Platform management</small></span></a><button class="logout" id="logout">Logout</button></header><main class="wrap main"><div class="eyebrow">suwung.id</div><h1 class="title">Platform Control</h1><p class="sub">Aktif/nonaktifkan platform dan maintenance tanpa redeploy.</p><section class="grid" id="grid"></section><p class="hint">Perubahan disimpan ke Supabase. Cache konfigurasi server maksimal beberapa detik.</p></main><script>const grid=document.getElementById('grid');const tokenKey='aiodl_admin_token';function token(){return localStorage.getItem(tokenKey)||''}async function api(path,opt={}){opt.headers={...(opt.headers||{}),'x-admin-token':token(),'Content-Type':'application/json'};const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed');return d}async function load(){if(!token()){const t=prompt('Masukkan AIODL Admin Token');if(!t){location.href='/';return}localStorage.setItem(tokenKey,t)}try{const d=await api('/api/admin/platforms');render(d.platforms)}catch(e){localStorage.removeItem(tokenKey);await Swal.fire({icon:'error',title:'Admin gagal dibuka',text:e.message});location.href='/'}}function render(items){grid.innerHTML=items.map(p=>`<article class="card" data-id="${p.id}"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="id">${esc(p.id)}</div><div class="status ${p.maintenance?'maint':p.enabled?'online':'off'}">${p.maintenance?'MAINTENANCE':p.enabled?'ONLINE':'DISABLED'}</div></div></div><div class="controls"><label class="switchrow">Enabled <input class="switch enabled" type="checkbox" ${p.enabled?'checked':''}></label><label class="switchrow">Maintenance <input class="switch maintenance" type="checkbox" ${p.maintenance?'checked':''}></label><textarea class="message" placeholder="Pesan maintenance">${esc(p.maintenance_message||'')}</textarea><button class="save">Simpan</button></div></article>`).join('');grid.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const c=b.closest('.card');b.disabled=true;try{await api('/api/admin/platforms/'+encodeURIComponent(c.dataset.id),{method:'PUT',body:JSON.stringify({enabled:c.querySelector('.enabled').checked,maintenance:c.querySelector('.maintenance').checked,maintenance_message:c.querySelector('.message').value})});await Swal.fire({toast:true,position:'top-end',icon:'success',title:'Tersimpan',showConfirmButton:false,timer:1600});await load()}catch(e){Swal.fire({icon:'error',title:'Gagal menyimpan',text:e.message})}finally{b.disabled=false}})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('logout').onclick=()=>{localStorage.removeItem(tokenKey);location.href='/admin/'};load();</script></body></html>
